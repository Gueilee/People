version: '3.9'

services:

  app:
    image: people-app:latest
    container_name: people_app
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - MAILER_URL=${MAILER_URL}
      - APP_URL=${APP_URL}
      - PG_HOST=${PG_HOST}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB}
    restart: unless-stopped
    networks:
      - people_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  sync-worker:
    image: people-sync:latest
    container_name: people_sync
    environment:
      - PG_HOST=${PG_HOST}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB}
      - CONVENIA_TOKEN=${CONVENIA_TOKEN}
      - TIQUETAQUE_TOKEN=${TIQUETAQUE_TOKEN}
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - people_net

networks:
  people_net:
    driver: bridge
