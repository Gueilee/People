version: '3.9'

services:

  app:
    image: people-app:latest
    container_name: people_app
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-vp-prod-vendemmia-2025}
      - MAILER_URL=${MAILER_URL:-}
      - APP_URL=${APP_URL:-https://people.vendemm.ia.br}
      - PG_HOST=${PG_HOST:-chico-bento-lake-pg-dev.postgres.database.azure.com}
      - PG_USER=${PG_USER:-projetos_admin}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB:-vdm_projetos}
    restart: unless-stopped
    networks:
      - people_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  sync-worker:
    image: people-sync:latest
    container_name: people_sync
    environment:
      - PG_HOST=${PG_HOST:-chico-bento-lake-pg-dev.postgres.database.azure.com}
      - PG_USER=${PG_USER:-projetos_admin}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB:-vdm_projetos}
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    networks:
      - people_net

networks:
  people_net:
    driver: bridge
