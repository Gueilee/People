name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Portainer
        id: auth
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_USER: ${{ secrets.PORTAINER_USER }}
          PORTAINER_PASSWORD: ${{ secrets.PORTAINER_PASSWORD }}
        run: |
          set -euo pipefail
          RESP=$(curl -skf -X POST "$PORTAINER_URL/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$PORTAINER_USER\",\"password\":\"$PORTAINER_PASSWORD\"}")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")
          if [ -z "$TOKEN" ]; then echo "ERRO: token vazio"; exit 1; fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Autenticado no Portainer com sucesso"

      - name: Build imagem frontend (people-app)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          cd frontend
          tar --exclude='.next' --exclude='node_modules' --exclude='*.db' \
              -cf /tmp/frontend-context.tar .
          echo "Build context: $(du -sh /tmp/frontend-context.tar | cut -f1)"

          RESULT=$(curl -skf -X POST \
            "$PORTAINER_URL/api/endpoints/3/docker/build?t=people-app:latest&dockerfile=Dockerfile&rm=1&forcerm=1&nocache=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/x-tar" \
            --data-binary @/tmp/frontend-context.tar \
            --max-time 600)

          echo "$RESULT" | tail -5
          echo "$RESULT" | python3 -c "
          import sys, json
          lines = [l.strip() for l in sys.stdin if l.strip()]
          if not lines:
              print('ERRO: resposta vazia do Docker build'); exit(1)
          for line in lines:
              try:
                  d = json.loads(line)
                  if 'error' in d:
                      print('BUILD ERROR:', d['error']); exit(1)
              except: pass
          print('Build frontend concluido')
          "

      - name: Build imagem backend/sync (people-sync)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          tar --exclude='backend/venv' --exclude='**/__pycache__' --exclude='**/*.pyc' \
              -cf /tmp/backend-context.tar backend/ scripts/

          RESULT=$(curl -skf -X POST \
            "$PORTAINER_URL/api/endpoints/3/docker/build?t=people-sync:latest&dockerfile=backend/Dockerfile&rm=1&forcerm=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/x-tar" \
            --data-binary @/tmp/backend-context.tar \
            --max-time 300)

          echo "$RESULT" | tail -3
          echo "$RESULT" | python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              try:
                  d = json.loads(line)
                  if 'error' in d:
                      print('BUILD ERROR:', d['error']); exit(1)
              except: pass
          print('Build backend/sync concluido')
          "

      - name: Recriar containers com nova imagem
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for CNAME in people_app people_sync; do
            echo "--- Removendo $CNAME ---"
            curl -sk -X POST \
              "$PORTAINER_URL/api/endpoints/3/docker/containers/$CNAME/stop" \
              -H "Authorization: Bearer $TOKEN" || true
            sleep 2
            RESP=$(curl -sk -o /dev/null -w "%{http_code}" -X DELETE \
              "$PORTAINER_URL/api/endpoints/3/docker/containers/$CNAME?force=1" \
              -H "Authorization: Bearer $TOKEN")
            echo "$CNAME: HTTP $RESP (204=removido, 404=nao existia)"
          done

      - name: Redeploiar stack no Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          MAILER_URL: ${{ secrets.MAILER_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CONVENIA_TOKEN: ${{ secrets.CONVENIA_TOKEN }}
          TIQUETAQUE_TOKEN: ${{ secrets.TIQUETAQUE_TOKEN }}
        run: |
          set -euo pipefail
          PAYLOAD=$(python3 -c "
          import json, os

          compose = open('docker-compose.yml').read()

          payload = {
            'stackFileContent': compose,
            'prune': True,
            'pullImage': False,
            'env': [
              {'name': 'SESSION_SECRET',   'value': os.environ['SESSION_SECRET']},
              {'name': 'APP_URL',          'value': 'https://people.vendemm.ia.br'},
              {'name': 'PG_PASSWORD',      'value': os.environ['PG_PASSWORD']},
              {'name': 'MAILER_URL',       'value': os.environ['MAILER_URL']},
              {'name': 'PG_HOST',          'value': 'chico-bento-lake-pg-dev.postgres.database.azure.com'},
              {'name': 'PG_USER',          'value': 'projetos_admin'},
              {'name': 'PG_DB',            'value': 'vdm_projetos'},
              {'name': 'CONVENIA_TOKEN',   'value': os.environ['CONVENIA_TOKEN']},
              {'name': 'TIQUETAQUE_TOKEN', 'value': os.environ['TIQUETAQUE_TOKEN']},
            ]
          }
          print(json.dumps(payload))
          ")

          RESULT=$(curl -skf -X PUT \
            "$PORTAINER_URL/api/stacks/11?endpointId=3" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if 'message' in d:
              print('ERRO:', d['message']); exit(1)
          print('Stack redesployada:', d.get('Name','?'), '— Status:', d.get('Status','?'))
          "
