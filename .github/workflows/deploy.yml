name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar tag de build
        run: echo "BUILD_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Autenticar no Portainer
        id: auth
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_USER: ${{ secrets.PORTAINER_USER }}
          PORTAINER_PASSWORD: ${{ secrets.PORTAINER_PASSWORD }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "$PORTAINER_URL/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$PORTAINER_USER\",\"password\":\"$PORTAINER_PASSWORD\"}")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")
          if [ -z "$TOKEN" ]; then echo "ERRO: token vazio"; exit 1; fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Autenticado no Portainer com sucesso"

      - name: Build imagem frontend (people-app)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
          BUILD_TAG: ${{ env.BUILD_TAG }}
        run: |
          set -euo pipefail
          cd frontend
          tar --exclude='.next' --exclude='node_modules' --exclude='*.db' \
              -cf /tmp/frontend-context.tar .

          echo "Enviando build context para Portainer (tag: $BUILD_TAG)..."
          RESULT=$(curl -sf -X POST \
            "$PORTAINER_URL/api/endpoints/3/docker/build?t=people-app:$BUILD_TAG&t=people-app:latest&dockerfile=Dockerfile&rm=1&forcerm=1&nocache=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/x-tar" \
            --data-binary @/tmp/frontend-context.tar \
            --max-time 600)

          echo "$RESULT" | tail -5
          echo "$RESULT" | python3 -c "
          import sys, json
          lines = [l.strip() for l in sys.stdin if l.strip()]
          if not lines:
              print('ERRO: resposta vazia do Docker build'); exit(1)
          for line in lines:
              try:
                  d = json.loads(line)
                  if 'error' in d:
                      print('BUILD ERROR:', d['error']); exit(1)
              except: pass
          print('Build frontend concluido')
          "

      - name: Build imagem backend/sync (people-sync)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          tar --exclude='backend/venv' --exclude='**/__pycache__' --exclude='**/*.pyc' \
              -cf /tmp/backend-context.tar backend/ scripts/

          RESULT=$(curl -sf -X POST \
            "$PORTAINER_URL/api/endpoints/3/docker/build?t=people-sync:latest&dockerfile=backend/Dockerfile&rm=1&forcerm=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/x-tar" \
            --data-binary @/tmp/backend-context.tar \
            --max-time 300)

          echo "$RESULT" | tail -3
          echo "$RESULT" | python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              try:
                  d = json.loads(line)
                  if 'error' in d:
                      print('BUILD ERROR:', d['error']); exit(1)
              except: pass
          print('Build backend/sync concluido')
          "

      - name: Recriar containers com nova imagem
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
          BUILD_TAG: ${{ env.BUILD_TAG }}
        run: |
          python3 - <<'PYEOF'
          import os, json, time, urllib.request, urllib.parse, ssl

          portainer = os.environ['PORTAINER_URL']
          token     = os.environ['TOKEN']
          build_tag = os.environ['BUILD_TAG']

          ctx = ssl._create_unverified_context()

          def api(method, path, data=None):
              url = f"{portainer}{path}"
              body = json.dumps(data).encode() if data else None
              req  = urllib.request.Request(url, method=method, data=body,
                         headers={'Authorization': f'Bearer {token}',
                                  'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')
                  print(f"  HTTP {e.code} em {path}: {body[:200]}")
                  return {}
              except Exception as e:
                  print(f"  Erro em {path}: {e}")
                  return {}

          for cname in ['people_app', 'people_sync']:
              flt = urllib.parse.quote(json.dumps({'name': [cname]}))
              containers = api('GET', f'/api/endpoints/3/docker/containers/json?all=1&filters={flt}')
              if not containers:
                  print(f'{cname}: nao encontrado (pode ja estar parado)')
                  continue
              for c in containers:
                  if not any(cname in n for n in c.get('Names', [])):
                      continue
                  cid = c['Id']
                  print(f'Parando {cname} ({cid[:12]})...')
                  api('POST', f'/api/endpoints/3/docker/containers/{cid}/stop')
                  time.sleep(2)
                  print(f'Removendo {cname} ({cid[:12]})...')
                  api('DELETE', f'/api/endpoints/3/docker/containers/{cid}')
                  print(f'Removido: {cname}')

          print('Containers removidos — redeploy vai recriar com imagem nova')
          PYEOF

      - name: Redeploiar stack no Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          TOKEN: ${{ steps.auth.outputs.token }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          MAILER_URL: ${{ secrets.MAILER_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CONVENIA_TOKEN: ${{ secrets.CONVENIA_TOKEN }}
          TIQUETAQUE_TOKEN: ${{ secrets.TIQUETAQUE_TOKEN }}
          BUILD_TAG: ${{ env.BUILD_TAG }}
        run: |
          set -euo pipefail
          PAYLOAD=$(python3 -c "
          import json, os

          # Substitui a tag no compose para forçar recriação do container
          compose = open('docker-compose.yml').read()
          compose = compose.replace('people-app:latest', f'people-app:{os.environ[\"BUILD_TAG\"]}')

          payload = {
            'stackFileContent': compose,
            'prune': True,
            'pullImage': False,
            'env': [
              {'name': 'SESSION_SECRET',   'value': os.environ['SESSION_SECRET']},
              {'name': 'APP_URL',          'value': 'https://people.vendemm.ia.br'},
              {'name': 'PG_PASSWORD',      'value': os.environ['PG_PASSWORD']},
              {'name': 'MAILER_URL',       'value': os.environ['MAILER_URL']},
              {'name': 'PG_HOST',          'value': 'chico-bento-lake-pg-dev.postgres.database.azure.com'},
              {'name': 'PG_USER',          'value': 'projetos_admin'},
              {'name': 'PG_DB',            'value': 'vdm_projetos'},
              {'name': 'CONVENIA_TOKEN',   'value': os.environ['CONVENIA_TOKEN']},
              {'name': 'TIQUETAQUE_TOKEN', 'value': os.environ['TIQUETAQUE_TOKEN']},
            ]
          }
          print(json.dumps(payload))
          ")

          RESULT=$(curl -sf -X PUT \
            "$PORTAINER_URL/api/stacks/11?endpointId=3" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if 'message' in d:
              print('ERRO:', d['message']); exit(1)
          print('Stack redesployada:', d.get('Name','?'), '— Status:', d.get('Status','?'))
          "
